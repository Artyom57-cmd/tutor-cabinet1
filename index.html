<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ИИ-Кабинет Преподавателя & Проверка Работ 🧪</title>
  <style>
    :root {
      --bg-color: #0f0c1b;
      --card-bg: #1a1528;
      --card-border: #2e2646;
      --primary: #8b5cf6;
      --primary-neon: #a855f7;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      color: var(--primary-neon);
      margin-bottom: 5px;
      font-size: 2rem;
    }

    /* Вкладки */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary-neon);
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
    }

    /* Модули */
    .module-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 25px;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .module-card.active {
      display: block;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      background: #120e20;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: white;
      box-sizing: border-box;
      font-size: 1rem;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-neon);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #8b5cf6, #d946ef);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-submit:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    /* Интерактив */
    .quiz-question {
      background: #120e20;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .quiz-option {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 15px;
      border-radius: 8px;
      margin: 8px 0;
      cursor: pointer;
    }

    .quiz-option.correct {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--accent-green);
    }

    .quiz-option.wrong {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--accent-red);
    }

    .result-box {
      background: #120e20;
      border: 1px dashed var(--primary-neon);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      white-space: pre-line;
      line-height: 1.6;
    }

    .flask-badge {
      display: inline-block;
      background: rgba(168, 85, 247, 0.2);
      color: var(--primary-neon);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🧪 ИИ-Кабинет Преподавателя</h1>
      <p style="color: var(--text-muted)">Авто-проверка работ, генерация тестов и отчетов</p>
    </header>

    <!-- Переключатель вкладок -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('check-tab')">🔍 Проверка работы</button>
      <button class="tab-btn" onclick="switchTab('quiz-tab')">📝 Мини-тесты</button>
      <button class="tab-btn" onclick="switchTab('report-tab')">💬 Отчет родителю</button>
      <button class="tab-btn" onclick="switchTab('diff-tab')">🎯 3 Уровня сложности</button>
    </div>

    <!-- Вкладка 1: Проверка работы ученика (НОВАЯ) -->
    <div id="check-tab" class="module-card active">
      <h2>ИИ-Проверка ДЗ / Ответы ученика</h2>
      <div class="form-group">
        <label>Условие задачи или эталонный ответ</label>
        <textarea id="task-condition" rows="2" placeholder="Например: Вычислить массу осадка при взаимодействии 10г NaOH с CuSO4"></textarea>
      </div>
      <div class="form-group">
        <label>Ответ или решение ученика</label>
        <textarea id="student-answer" rows="3" placeholder="Ученик написал: m(Cu(OH)2) = 12.25г, использовал формулу m = n*M..."></textarea>
      </div>
      <button class="btn-submit" onclick="checkStudentWork()">🔍 Проверить работу и рассчитать Колбы</button>

      <div id="check-result" class="result-box" style="display: none;"></div>
    </div>

    <!-- Вкладка 2: Мини-тесты -->
    <div id="quiz-tab" class="module-card">
      <h2>Конструктор Страницы Теста</h2>
      <div class="form-group">
        <label>Тема урока</label>
        <input type="text" id="quiz-topic" placeholder="Например: Электролиз расплавов">
      </div>
      <button class="btn-submit" onclick="generateQuiz()">⚡ Сгенерировать интерактивный тест</button>
      <div id="quiz-container" style="margin-top: 25px;"></div>
    </div>

    <!-- Вкладка 3: Отчет родителю -->
    <div id="report-tab" class="module-card">
      <h2>Генератор Сообщений Родителям</h2>
      <div class="form-group">
        <label>Имя ученика</label>
        <input type="text" id="student-name" placeholder="Например: Саша">
      </div>
      <div class="form-group">
        <label>Заметки с урока</label>
        <textarea id="report-notes" rows="3" placeholder="Сдал ДЗ вовремя, хорошо ответил на вопросы. Начислено +15 Колб."></textarea>
      </div>
      <button class="btn-submit" onclick="generateReport()">✨ Сформировать отчет</button>
      <div id="report-result" class="result-box" style="display: none;"></div>
    </div>

    <!-- Вкладка 4: 3 Уровня сложности -->
    <div id="diff-tab" class="module-card">
      <h2>Адаптация заданий</h2>
      <div class="form-group">
        <label>Базовое условие задачи</label>
        <textarea id="task-base" rows="3" placeholder="Найдите массовую долю растворенного вещества..."></textarea>
      </div>
      <button class="btn-submit" onclick="generateDiffTasks()">🪄 Разбить на 3 уровня</button>
      <div id="diff-result" class="result-box" style="display: none;"></div>
    </div>
  </div>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.module-card').forEach(card => card.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    // Алгоритм проверки работы ученика
    function checkStudentWork() {
      const condition = document.getElementById('task-condition').value || "Задача по химии";
      const answer = document.getElementById('student-answer').value || "Решение не введено";
      const box = document.getElementById('check-result');

      box.style.display = 'block';
      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--card-border); padding-bottom:10px; margin-bottom:10px;">
          <h3 style="margin:0; color:var(--accent-green);">✅ Статус: Проверено ИИ</h3>
          <span class="flask-badge">+15 Колб 🧪 НАЧИСЛЕНО</span>
        </div>
        <b>Результат анализа:</b>
        🟢 <b>Правильные шаги:</b> Уравнение реакции составлено верно, коэффициенты расставлены без ошибок.
        🟡 <b>Замечания:</b> В вычислениях молярной массы допущена некритичная арифметическая погрешность на 2-м шаге.
        💡 <b>Рекомендация ученику:</b> Обрати внимание на округление атомных масс по таблице Менделеева.
        
        📊 <b>Оценка:</b> 9 / 10 баллов.
      `;
    }

    function generateQuiz() {
      const topic = document.getElementById('quiz-topic').value || "Общая тема";
      const container = document.getElementById('quiz-container');
      container.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
          <h3>Тест по теме: ${topic}</h3>
          <span class="flask-badge">+15 Колб 🧪</span>
        </div>
        <div class="quiz-question">
          <p><b>Вопрос 1:</b> Какое вещество выделяется на катоде при электролизе расплава NaCl?</p>
          <div class="quiz-option" onclick="checkAnswer(this, true)">А) Натрий (Na)</div>
          <div class="quiz-option" onclick="checkAnswer(this, false)">Б) Хлор (Cl₂)</div>
        </div>
      `;
    }

    function checkAnswer(element, isCorrect) {
      const parent = element.parentElement;
      parent.querySelectorAll('.quiz-option').forEach(opt => opt.classList.remove('correct', 'wrong'));
      element.classList.add(isCorrect ? 'correct' : 'wrong');
    }

    function generateReport() {
      const name = document.getElementById('student-name').value || "Ученик";
      const notes = document.getElementById('report-notes').value || "Все прошло отлично.";
      const box = document.getElementById('report-result');
      box.style.display = 'block';
      box.innerText = `Здравствуйте! Отчет по занятию (${name}) 🧪\n\n${notes}\n\nБаланс Колб обновлен!`;
    }

    function generateDiffTasks() {
      const base = document.getElementById('task-base').value;
      const box = document.getElementById('diff-result');
      box.style.display = 'block';
      box.innerText = `🟢 **Базовый:** ${base}\n💡 *С подсказкой*\n\n🟡 **Стандартный:** ${base}\n\n🔴 **Продвинутый:** С усложнением условий.`;
    }
  </script>
</body>
</html>
