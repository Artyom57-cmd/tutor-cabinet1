<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет родителя</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            padding: 24px;
            margin-bottom: 16px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        #auth-screen, #dashboard-screen {
            display: none;
        }

        #auth-screen.active, #dashboard-screen.active {
            display: block;
        }

        .error-msg {
            color: var(--error);
            font-size: 0.875rem;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Окно ввода номера телефона / входа -->
    <div id="auth-screen" class="card active">
        <h2 class="title">Вход в кабинет родителя</h2>
        <p class="subtitle">Введите номер телефона, указанный преподавателем</p>
        <form id="phoneAuthForm">
            <div class="form-group">
                <label for="phoneInput">Номер телефона</label>
                <input type="tel" id="phoneInput" placeholder="+7 (999) 000-00-00" required>
            </div>
            <button type="submit" class="btn">Войти</button>
            <div id="authError" class="error-msg"></div>
        </form>
    </div>

    <!-- Панель с информацией ученика (после входа) -->
    <div id="dashboard-screen" class="card">
        <h2 class="title" id="studentNameTitle">Успеваемость ученика</h2>
        <div id="studentDetails">
            <!-- Данные ученика загрузятся сюда -->
        </div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAHxz8YoyHn5QK-ekR9Q1aS9KfatAbe3Go",
    authDomain: "tutorcabinet-8b2c6.firebaseapp.com",
    projectId: "tutorcabinet-8b2c6",
    storageBucket: "tutorcabinet-8b2c6.firebasestorage.app",
    messagingSenderId: "658054043647",
    appId: "1:658054043647:web:55fca77b1f31d8dc4679ca",
    measurementId: "G-F8Q3530MQ5"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Получаем ID ученика из параметров URL (?id=...)
  const urlParams = new URLSearchParams(window.location.search);
  const studentId = urlParams.get('id');

  const authScreen = document.getElementById('auth-screen');
  const dashboardScreen = document.getElementById('dashboard-screen');
  const authError = document.getElementById('authError');

  if (!studentId) {
    authError.innerText = "Ошибка: неверная ссылка доступа.";
  }

  document.getElementById('phoneAuthForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    authError.innerText = '';
    const inputPhone = document.getElementById('phoneInput').value.replace(/\D/g, '');

    if (!studentId) {
      authError.innerText = "Невалидный ID ученика в ссылке.";
      return;
    }

    try {
      const studentDoc = await getDoc(doc(db, "students", studentId));
      if (studentDoc.exists()) {
        const studentData = studentDoc.data();
        const savedPhone = (studentData.parentContacts || '').replace(/\D/g, '');

        // Сверяем введенный номер с контактами родителя в базе
        if (savedPhone && inputPhone && savedPhone.includes(inputPhone)) {
          authScreen.classList.remove('active');
          dashboardScreen.classList.add('active');
          
          document.getElementById('studentNameTitle').innerText = `Ученик: ${studentData.name}`;
          document.getElementById('studentDetails').innerHTML = `
            <p><strong>Класс:</strong> ${studentData.grade || '—'}</p>
            <p><strong>Цель:</strong> ${studentData.goal || '—'}</p>
            <p><strong>Баланс баллов:</strong> ${studentData.flasksBalance || 0}</p>
          `;
        } else {
          authError.innerText = "Номер телефона не найден или введен неверно.";
        }
      } else {
        authError.innerText = "Ученик не найден в системе.";
      }
    } catch (err) {
      authError.innerText = "Ошибка загрузки данных: " + err.message;
    }
  });
</script>

</body>
</html>
