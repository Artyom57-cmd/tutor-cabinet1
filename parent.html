<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет родителя</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            padding: 24px;
            margin-bottom: 16px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            margin-top: 12px;
        }

        .btn-outline:hover {
            background-color: #f9fafb;
        }

        .error-message {
            color: var(--error);
            font-size: 0.875rem;
            margin-top: 8px;
            text-align: center;
            display: none;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .info-value {
            font-weight: 600;
            font-size: 0.875rem;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success {
            background-color: #d1fae5;
            color: #065f46;
        }

        .badge-danger {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Экран авторизации -->
    <div id="authScreen" class="card">
        <h1 class="title">Вход для родителей</h1>
        <p class="subtitle">Введите номер телефона, указанный в карточке ученика</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="phoneInput">Номер телефона</label>
                <input type="tel" id="phoneInput" placeholder="+7 (999) 000-00-00" required>
            </div>
            
            <button type="submit" class="btn">Войти</button>
            <div id="authError" class="error-message">Ученик с таким номером телефона не найден</div>
        </form>
    </div>

    <!-- Экран кабинета -->
    <div id="dashboardScreen" class="hidden">
        <div class="card">
            <h1 class="title" id="studentName">—</h1>
            <p class="subtitle">Карточка ученика</p>

            <div class="info-row">
                <span class="info-label">Статус:</span>
                <span class="info-value"><span id="studentStatus" class="badge badge-success">Активен</span></span>
            </div>
            <div class="info-row">
                <span class="info-label">Группа / Класс:</span>
                <span class="info-value" id="studentGroup">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Баланс занятий:</span>
                <span class="info-value" id="studentBalance">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Телефон родителя:</span>
                <span class="info-value" id="studentPhone">—</span>
            </div>
        </div>

        <div class="card">
            <h2 class="title" style="font-size: 1rem; text-align: left; margin-bottom: 12px;">Последняя активность</h2>
            <div class="info-row">
                <span class="info-label">Последнее посещение:</span>
                <span class="info-value" id="lastAttendance">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Оплата:</span>
                <span class="info-value" id="paymentStatus">—</span>
            </div>
        </div>

        <button id="logoutBtn" class="btn btn-outline">Выйти</button>
    </div>
</div>

<script>
    // Нормализация номера телефона (оставляем только цифры)
    function cleanPhone(phone) {
        return phone.replace(/\D/g, '');
    }

    // Получение данных учеников из localStorage (синхронизировано с основной CRM)
    function getStudents() {
        const data = localStorage.getItem('crm_students');
        return data ? JSON.parse(data) : [];
    }

    // Автоматический вход по URL-параметру ?student_id=...
    function checkUrlAuth() {
        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('student_id');

        if (studentId) {
            const students = getStudents();
            const student = students.find(s => String(s.id) === String(studentId));
            if (student) {
                renderDashboard(student);
                return true;
            }
        }
        return false;
    }

    // Отрисовка данных ученика
    function renderDashboard(student) {
        document.getElementById('studentName').textContent = student.name || 'Не указано';
        document.getElementById('studentGroup').textContent = student.group || 'Не назначена';
        document.getElementById('studentBalance').textContent = (student.balance !== undefined ? student.balance : 0) + ' занятий';
        document.getElementById('studentPhone').textContent = student.phone || 'Не указан';
        document.getElementById('lastAttendance').textContent = student.lastAttendance || 'Нет данных';
        
        const paymentEl = document.getElementById('paymentStatus');
        if (student.paid) {
            paymentEl.textContent = 'Оплачено';
            paymentEl.className = 'info-value badge badge-success';
        } else {
            paymentEl.textContent = 'Задолженность';
            paymentEl.className = 'info-value badge badge-danger';
        }

        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.remove('hidden');
    }

    // Авторизация по номеру телефона
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const inputPhone = cleanPhone(document.getElementById('phoneInput').value);
        const errorEl = document.getElementById('authError');
        errorEl.style.display = 'none';

        if (!inputPhone) return;

        const students = getStudents();
        const student = students.find(s => cleanPhone(s.phone || '') === inputPhone);

        if (student) {
            renderDashboard(student);
        } else {
            errorEl.style.display = 'block';
        }
    });

    // Выход
    document.getElementById('logoutBtn').addEventListener('click', function() {
        // Очищаем параметры URL без перезагрузки
        window.history.pushState({}, document.title, window.location.pathname);
        document.getElementById('dashboardScreen').classList.add('hidden');
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('phoneInput').value = '';
    });

    // Инициализация при загрузке
    window.addEventListener('DOMContentLoaded', () => {
        checkUrlAuth();
    });
</script>

</body>
</html>
